<svg xmlns="http://www.w3.org/2000/svg" width="260" height="488" viewBox="0 0 260 488" role="img" aria-label="Animated pencil-sketch portrait revealing into color">
<defs>
  <filter id="pencil"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="gamma" amplitude="1.25" exponent=".6" offset="0"/><feFuncG type="gamma" amplitude="1.25" exponent=".6" offset="0"/><feFuncB type="gamma" amplitude="1.25" exponent=".6" offset="0"/></feComponentTransfer></filter>
  <clipPath id="rise"><rect x="0" y="488" width="260" height="0"><animate attributeName="y" dur="7s" repeatCount="indefinite" keyTimes="0;.15;.62;.85;1" values="488;488;0;0;488"/><animate attributeName="height" dur="7s" repeatCount="indefinite" keyTimes="0;.15;.62;.85;1" values="0;0;488;488;0"/></rect></clipPath>
  <clipPath id="round"><rect x="4" y="4" width="252" height="480" rx="16"/></clipPath>
</defs>
<rect width="260" height="488" fill="#ddc8aa" rx="16"/>
<g clip-path="url(#round)">
 <image href="data:image/jpeg;base64," x="0" y="0" width="260" height="488" preserveAspectRatio="xMidYMid slice" filter="url(#pencil)"/>
 <image href="data:image/jpeg;base64," x="0" y="0" width="260" height="488" preserveAspectRatio="xMidYMid slice" clip-path="url(#rise)"/>
</g>
<rect x="2" y="2" width="256" height="484" rx="16" fill="none" stroke="#c59b65" stroke-width="3"/>
<path d="M26 94 Q95 17 173 44 Q245 77 224 155" fill="none" stroke="#473529" stroke-width="2" stroke-dasharray="330" stroke-dashoffset="330" opacity=".55"><animate attributeName="stroke-dashoffset" values="330;0;0;330" keyTimes="0;.30;.85;1" dur="7s" repeatCount="indefinite"/></path>
</svg>